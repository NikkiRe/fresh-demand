[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fresh-demand"
version = "0.2.0"
description = "Decision-aware exploration and identification in inventory learning with censored feedback"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "polars==2.1.0",
  "lightgbm==4.7.0",
  "scikit-learn==1.9.1",
  "pyarrow>=20,<27",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "matplotlib>=3.9,<4"]

[project.scripts]
fresh-demand = "fresh_demand.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/fresh_demand"]
